stages:
    - deploy

variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: '1'

# Build and publish only on git tags.
# Branch pushes (main, develop) do not trigger Docker builds — releases are tag-driven.
build_and_push:
    stage: deploy
    image: docker:24
    services:
        - docker:24-dind
    before_script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        - docker buildx create --use --name flowise-builder
    script:
        - |
            docker buildx build \
              --cache-from type=registry,ref=$IMAGE_NAME:buildcache \
              --cache-to   type=registry,ref=$IMAGE_NAME:buildcache,mode=max \
              -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA \
              -t $IMAGE_NAME:$CI_COMMIT_TAG \
              -t $IMAGE_NAME:latest \
              --push \
              .
    after_script:
        - docker logout $CI_REGISTRY
    only:
        - tags
